schema: spec-driven

context: |
  Git Branching Workflow:
  - All changes must be developed in an isolated git branch named `change/<change-name>`.
  - Never edit or implement code directly on `main`.
  - When archiving, stage and commit the changes on the branch.
  - Do NOT merge back to `main` unless the user explicitly asks to merge.

operations:
  apply:
    guidance:
      - Before modifying any files, verify the current branch is `change/<change-name>`. If on `main`, switch to or create the change branch first.
      - Verify all tests pass on the branch before completing.
  archive:
    guidance:
      - Commit all archived specs, changes, and modified code to the change branch.
      - Do not merge to `main` without explicit user confirmation.
